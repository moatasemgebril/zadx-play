name: zadx
description: "Zad X — Play • Learn • Shine. An Islamic family app that unlocks games after tasks and prayer."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # State & navigation
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.0

  # Storage
  shared_preferences: ^2.3.3

  # UI
  google_fonts: ^6.2.1

  # Audio (adhan + Quran)
  just_audio: ^0.9.42
  just_audio_windows: ^0.2.2

  # Notifications at prayer times
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0

  # Location (optional auto-detect city)
  geolocator: ^13.0.2

  # Subscriptions
  in_app_purchase: ^3.2.0

  # Family sync + backend (Firebase)
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0
  cloud_functions: ^5.2.0

  # Quran text (Quran.com API) with local cache
  http: ^1.2.2

  # Parent PIN hashing
  crypto: ^3.0.6

  # Sharing invite codes / opening other apps
  share_plus: ^10.1.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/audio/
    - assets/sfx/
