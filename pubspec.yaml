name: zadx
description: "Zad X — Play • Learn • Shine. An Islamic family app that unlocks games after tasks and prayer."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # State & navigation
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.0

  # Storage
  shared_preferences: ^2.3.3

  # Audio (adhan + Quran)
  just_audio: ^0.9.42
  just_audio_windows: ^0.2.2

  # Notifications at prayer times
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0

  # Umm al-Qura Hijri calendar, only for the Ramadan Isha rule (Isha = Maghrib + 120 min).
  # docs/decisions/PRAYER-TIMES-ACCURACY.md section 3. Offline, no network access.
  hijri: ^3.0.1

  # Subscriptions
  in_app_purchase: ^3.2.0

  # Family sync + backend (Firebase)
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0
  cloud_functions: ^5.2.0

  # Quran text (Quran.com API) with local cache
  http: ^1.2.2

  # Parent PIN hashing
  crypto: ^3.0.6

  # Sharing invite codes / opening other apps
  share_plus: ^10.1.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/audio/
    - assets/sfx/
    # Licences of the bundled fonts (shown on the Licences page). docs/FONTS.md
    - assets/fonts/tajawal/OFL.txt
    - assets/fonts/baloobhaijaan2/OFL.txt
    - assets/fonts/amiriquran/OFL.txt

  # Fonts ship inside the app and are never downloaded at runtime (child privacy, offline).
  # Source, licence and SHA-256 of every file: docs/FONTS.md. Keep in sync with AppFonts.files.
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/tajawal/Tajawal-Regular.ttf
        - asset: assets/fonts/tajawal/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/tajawal/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/tajawal/Tajawal-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/tajawal/Tajawal-Black.ttf
          weight: 900
    - family: Baloo Bhaijaan 2
      fonts:
        # Upstream variable font (wght 400-800). Only used at 800 (AppTheme.display sets the axis).
        - asset: assets/fonts/baloobhaijaan2/BalooBhaijaan2-VariableFont_wght.ttf
          weight: 800
    - family: Amiri Quran
      fonts:
        - asset: assets/fonts/amiriquran/AmiriQuran-Regular.ttf
