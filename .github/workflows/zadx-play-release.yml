# Zad X Play – signed Android App Bundle (.aab) for Google Play.
#
# Runs only when a tag "play-v*" is pushed (or by hand), so it costs no minutes on normal pushes.
# The Play upload key comes from GitHub Secrets (never from the repo):
#   ZADX_UPLOAD_KEYSTORE_B64   base64 of the upload keystore (.jks)
#   ZADX_UPLOAD_KEYSTORE_PASSWORD, ZADX_UPLOAD_KEY_ALIAS, ZADX_UPLOAD_KEY_PASSWORD
# Google Play App Signing keeps the real app-signing key; this is only the upload key, and Google
# can reset it if it is ever lost. Without the secrets the job stops with a clear message.
#
# Output: the "play-latest" pre-release with zadx-play-<version>.aab, ready to upload in
# Play Console → Testing → Closed testing → Create release.
name: Zad X Play – Play Store bundle

on:
  push:
    tags: ["play-v*"]
  workflow_dispatch:

concurrency:
  group: play-release
  cancel-in-progress: false

jobs:
  aab:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check the upload key secrets
        env:
          KS_B64: ${{ secrets.ZADX_UPLOAD_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::error::Missing secret ZADX_UPLOAD_KEYSTORE_B64 (see docs/store/GOOGLE-PLAY-SUBMISSION.md)"; exit 1
          fi
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Generate native shells (keeps our native files)
        run: |
          mkdir -p /tmp/keep && cp -r android ios /tmp/keep/
          flutter create --org com.zadx --project-name zadx --platforms android .
          cp -r /tmp/keep/android/. android/
          rm -f test/widget_test.dart
          python3 android/scripts/integrate_native.py
          grep -E "targetSdk = 36" android/app/build.gradle.kts
      - name: Write the signing config (runner only)
        env:
          KS_B64: ${{ secrets.ZADX_UPLOAD_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ZADX_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ZADX_UPLOAD_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ZADX_UPLOAD_KEY_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > android/app/upload.jks
          {
            echo "storeFile=upload.jks"
            echo "storePassword=$KS_PASS"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASS"
          } > android/key.properties
      - run: flutter pub get
      - run: flutter gen-l10n
      - name: Build the release bundle
        run: |
          # Play needs a new, higher version code for every upload.
          BUILD=$((100 + ${{ github.run_number }}))
          flutter build appbundle --release --build-number=$BUILD
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          mkdir -p out && cp build/app/outputs/bundle/release/app-release.aab "out/zadx-play-$VERSION-$BUILD.aab"
          echo "AAB_NAME=zadx-play-$VERSION-$BUILD.aab" >> "$GITHUB_ENV"
      - name: Check the bundle is signed with the upload key (not the debug key)
        run: |
          jarsigner -verify -certs "out/$AAB_NAME" | tee /tmp/verify.txt
          if grep -q "CN=Android Debug" /tmp/verify.txt; then echo "::error::signed with the debug key"; exit 1; fi
          grep -q "jar verified" /tmp/verify.txt
      - name: Remove the key from the runner
        if: always()
        run: rm -f android/app/upload.jks android/key.properties
      - uses: actions/upload-artifact@v4
        with:
          name: zadx-play-aab
          path: out/*.aab
          retention-days: 7
      - name: Publish to the "play-latest" pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: play-latest
          name: "Zad X Play – Google Play bundle (upload in Play Console)"
          prerelease: true
          make_latest: false
          files: out/*.aab
          body: |
            Signed release bundle for Google Play from ${{ github.sha }} (${{ github.ref_name }}).
            Upload it in Play Console → Test and release → Closed testing → Create release.
            A .aab cannot be installed on a phone directly.
