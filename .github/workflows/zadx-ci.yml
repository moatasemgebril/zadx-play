# ZADX Team — automatic build & device testing (GitHub Actions)
# Owner decision 2026-11-20: save Actions minutes.
#   Pull requests  -> LIGHT checks only: analyze, tests, Android APK, backend.
#   Push to main   -> light checks + heavy jobs ONLY for the platforms whose files changed.
#   Nightly (Mon-Sat)  -> light checks + Android emulator, ONLY if main changed in the last ~25 h.
#   Weekly (Sunday) / manual ("Run workflow") -> everything (emulator, iOS, Windows, real phones);
#                         the weekly run is skipped if main did not change in the last 8 days.
#   (iOS = macOS minutes x10: the owner keeps the free plan with a $0 spending limit, so iOS is weekly.)
# Docs-only changes (*.md, docs/, reports/) do not run CI at all.
name: ZADX CI – build & device tests

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**", "reports/**"]
  pull_request:
    paths-ignore: ["**/*.md", "docs/**", "reports/**"]
  schedule:
    - cron: "17 10 * * 1-6"   # nightly light + emulator (~2-3 AM Pacific), Mon-Sat
    - cron: "37 10 * * 0"     # weekly full run incl. iOS + Windows, Sunday
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 0) What changed? push: which platforms; schedule: did main change recently at all?
  changes:
    if: github.event_name == 'push' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.f.outputs.app }}
      ios: ${{ steps.f.outputs.ios }}
      windows: ${{ steps.f.outputs.windows }}
      recent: ${{ steps.r.outputs.recent }}
      weekly: ${{ steps.r.outputs.weekly }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 100 }
      - name: Recent commits on main? (scheduled runs only)
        id: r
        if: github.event_name == 'schedule'
        run: |
          if [ "${{ github.event.schedule }}" = "37 10 * * 0" ]; then
            echo "weekly=true" >> "$GITHUB_OUTPUT"; SINCE="8 days ago"
          else
            echo "weekly=false" >> "$GITHUB_OUTPUT"; SINCE="25 hours ago"
          fi
          if [ -n "$(git log --since="$SINCE" --oneline | head -1)" ]; then
            echo "recent=true" >> "$GITHUB_OUTPUT"
          else
            echo "recent=false" >> "$GITHUB_OUTPUT"; echo "No commits since $SINCE - skipping scheduled run."
          fi
      - uses: dorny/paths-filter@v3
        id: f
        if: github.event_name == 'push'
        with:
          filters: |
            app:
              - 'lib/**'
              - 'android/**'
              - 'assets/**'
              - 'pubspec.*'
            ios:
              - 'ios/**'
            windows:
              - 'windows_guard/**'

  # 1) Static checks + unit tests + Android APK
  flutter:
    needs: changes
    if: >-
      always() && needs.changes.result != 'failure' &&
      (github.event_name != 'schedule' || needs.changes.outputs.recent == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      # Gradle cache: setup-java's `cache: gradle` fails here because the Gradle files are only
      # generated later by `flutter create`, so we cache ~/.gradle directly.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('pubspec.yaml', 'pubspec.lock', 'android/**/*.gradle*', 'android/scripts/integrate_native.py') }}
          restore-keys: gradle-${{ runner.os }}-
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Generate native shells (keeps our native files)
        run: |
          mkdir -p /tmp/keep && cp -r android ios /tmp/keep/
          flutter create --org com.zadx --project-name zadx --platforms android,ios,web,windows,macos .
          cp -r /tmp/keep/android/. android/ && cp -r /tmp/keep/ios/. ios/
          rm -f test/widget_test.dart   # template test from flutter create, not ours
          python3 android/scripts/integrate_native.py
      - run: flutter pub get
      - run: flutter gen-l10n
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Unit tests
        run: flutter test --coverage
      - name: Build Android APK (debug, installable for testing)
        run: flutter build apk --debug
      - name: Kotlin rule tests (LockRules - device lock + protection)
        run: cd android && ./gradlew :app:testDebugUnitTest --console=plain
      - name: Build web (parent dashboard) – not on PRs, to save minutes
        if: github.event_name != 'pull_request'
        run: flutter build web --release --base-href /zadx-play/ --pwa-strategy=none   # no service worker: iPhones always load the newest version
      - name: Upload web build for the iPhone/browser test preview
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: zadx-android-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 7

  # 2) Run the app on an Android emulator (smoke test: installs + launches + 300 taps)
  #    Heavy: nightly/manual, or on main when app code changed. Never on PRs.
  android-emulator:
    needs: [flutter, changes]
    if: >-
      always() && needs.flutter.result == 'success' &&
      ((github.event_name == 'schedule' && needs.changes.outputs.recent == 'true') ||
       github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && needs.changes.outputs.app == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/download-artifact@v4
        with: { name: zadx-android-apk }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          script: |
            adb install -r app-debug.apk
            adb shell monkey -p com.zadx.app -c android.intent.category.LAUNCHER 1
            sleep 15
            adb shell pidof com.zadx.app && echo "App is running" || (adb logcat -d | tail -200; exit 1)
            adb shell monkey -p com.zadx.app --throttle 300 -v 300

  # 3) Real devices in Firebase Test Lab (runs only when the secret is set)
  #    Nightly/manual only.
  firebase-test-lab:
    needs: [flutter, changes]
    if: >-
      always() && needs.flutter.result == 'success' &&
      ((github.event_name == 'schedule' && needs.changes.outputs.weekly == 'true') ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.GCP_SA_KEY != '' }}
    steps:
      - if: env.HAS_KEY != 'true'
        run: echo "GCP_SA_KEY not set - skipping real-device tests"
      - if: env.HAS_KEY == 'true'
        uses: actions/download-artifact@v4
        with: { name: zadx-android-apk }
      - if: env.HAS_KEY == 'true'
        uses: google-github-actions/auth@v2
        with: { credentials_json: "${{ secrets.GCP_SA_KEY }}" }
      - if: env.HAS_KEY == 'true'
        uses: google-github-actions/setup-gcloud@v2
      - if: env.HAS_KEY == 'true'
        name: Robo test on real phones
        run: |
          gcloud firebase test android run --type robo --app app-debug.apk \
            --device model=oriole,version=33 --device model=a10,version=29 \
            --timeout 5m --locales ar,en

  # 4) iOS compile check (no signing)
  ios:
    # macOS minutes cost x10: weekly (Sunday) / manual, or on main when ios/** changed.
    needs: changes
    if: >-
      always() &&
      ((github.event_name == 'schedule' && needs.changes.outputs.weekly == 'true' &&
        needs.changes.outputs.recent == 'true') ||
       github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && needs.changes.outputs.ios == 'true'))
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: |
          mkdir -p /tmp/keep && cp -r android ios /tmp/keep/
          flutter create --org com.zadx --project-name zadx --platforms android,ios .
          cp -r /tmp/keep/ios/. ios/
          rm -f test/widget_test.dart
          flutter pub get && flutter gen-l10n
          ruby ios/scripts/add_native_files.rb
          sed -i '' "s/^# platform :ios.*/platform :ios, '16.0'/" ios/Podfile || true
          # Simulator build: proves the iOS app compiles without an Apple signing team.
          flutter build ios --simulator --debug

  # 5) Backend (Firebase Functions) compiles
  backend:
    needs: changes
    if: >-
      always() && needs.changes.result != 'failure' &&
      (github.event_name != 'schedule' || needs.changes.outputs.recent == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: { run: { working-directory: backend/functions } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('backend/functions/package.json', 'backend/functions/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - run: npm install
      - run: npm run build
      - run: npm test
      - run: npm audit --audit-level=high
      # Firestore rules tests (R-32 / R-33) on the emulator. firebase-tools and the rules-testing SDK
      # are installed after the audit and never saved to package.json: `npm audit` above stays about
      # what we deploy (the client SDK's grpc-js advisories do not ship to production).
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-v14
      - run: npm install -g firebase-tools@14 --no-audit --no-fund
      - run: npm run test:rules:deps
      - name: Firestore rules tests (emulator)
        run: npm run test:rules

  # 6) Windows "Zad X Guard" builds
  #    Windows minutes cost x2: weekly (Sunday) / manual, or on main when windows_guard/** changed.
  windows-guard:
    needs: changes
    if: >-
      always() &&
      ((github.event_name == 'schedule' && needs.changes.outputs.weekly == 'true' &&
        needs.changes.outputs.recent == 'true') ||
       github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && needs.changes.outputs.windows == 'true'))
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x" }
      - run: dotnet build windows_guard/ZadXGuard.csproj -c Release

  # Owner test build: after the emulator smoke test passes on main, publish the debug APK
  # to a fixed pre-release so the owner can install it from a direct link (no login, no zip):
  # https://github.com/moatasemgebril/zadx-play/releases/download/test-latest/zadx-play-test.apk
  publish-test-apk:
    needs: [android-emulator]
    if: >-
      always() && needs.android-emulator.result == 'success' &&
      github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: zadx-android-apk }
      - name: Rename APK
        run: mv app-debug.apk zadx-play-test.apk
      - name: Publish to the "test-latest" pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-latest
          name: "Zad X Play – test build (not for children yet)"
          prerelease: true
          make_latest: false
          body: |
            Latest test build of Zad X Play from main (${{ github.sha }}).
            For the owner and testers only. Debug build: not signed for the Play Store.
            Install on Android: open the link on the phone, download, then allow "Install unknown apps" for your browser.
          files: zadx-play-test.apk

  # Owner test preview for iPhone / any browser (GitHub Pages, free on public repos):
  # https://moatasemgebril.github.io/zadx-play/
  deploy-web-preview:
    needs: [flutter]
    if: >-
      always() && needs.flutter.result == 'success' &&
      github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
