# ZADX Team — automatic build & device testing (GitHub Actions)
# Owner decision 2026-11-20: save Actions minutes.
#   Pull requests  -> LIGHT checks only: analyze, tests, Android APK, backend.
#   Push to main   -> light checks + heavy jobs ONLY for the platforms whose files changed.
#   Nightly / manual ("Run workflow") -> everything (emulator, iOS, Windows, real phones).
# Docs-only changes (*.md, docs/, reports/) do not run CI at all.
name: ZADX CI – build & device tests

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**", "reports/**"]
  pull_request:
    paths-ignore: ["**/*.md", "docs/**", "reports/**"]
  schedule:
    - cron: "17 10 * * *"   # nightly full run (~2-3 AM Pacific)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zadx-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 0) Which platforms changed? (used only on push to main, to skip heavy jobs)
  changes:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.f.outputs.app }}
      ios: ${{ steps.f.outputs.ios }}
      windows: ${{ steps.f.outputs.windows }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            app:
              - 'lib/**'
              - 'android/**'
              - 'assets/**'
              - 'pubspec.*'
            ios:
              - 'ios/**'
              - 'lib/**'
              - 'pubspec.*'
            windows:
              - 'windows_guard/**'

  # 1) Static checks + unit tests + Android APK
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17", cache: gradle }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Generate native shells (keeps our native files)
        run: |
          mkdir -p /tmp/keep && cp -r android ios /tmp/keep/
          flutter create --org com.zadx --project-name zadx --platforms android,ios,web,windows,macos .
          cp -r /tmp/keep/android/. android/ && cp -r /tmp/keep/ios/. ios/
          rm -f test/widget_test.dart   # template test from flutter create, not ours
          python3 android/scripts/integrate_native.py
      - run: flutter pub get
      - run: flutter gen-l10n
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Unit tests
        run: flutter test --coverage
      - name: Build Android APK (debug, installable for testing)
        run: flutter build apk --debug
      - name: Build web (parent dashboard)
        run: flutter build web --release
      - uses: actions/upload-artifact@v4
        with:
          name: zadx-android-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 7

  # 2) Run the app on an Android emulator (smoke test: installs + launches + 300 taps)
  #    Heavy: nightly/manual, or on main when app code changed. Never on PRs.
  android-emulator:
    needs: [flutter, changes]
    if: >-
      always() && needs.flutter.result == 'success' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && needs.changes.outputs.app == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/download-artifact@v4
        with: { name: zadx-android-apk }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          script: |
            adb install -r app-debug.apk
            adb shell monkey -p com.zadx.app -c android.intent.category.LAUNCHER 1
            sleep 15
            adb shell pidof com.zadx.app && echo "App is running" || (adb logcat -d | tail -200; exit 1)
            adb shell monkey -p com.zadx.app --throttle 300 -v 300

  # 3) Real devices in Firebase Test Lab (runs only when the secret is set)
  #    Nightly/manual only.
  firebase-test-lab:
    needs: flutter
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.GCP_SA_KEY != '' }}
    steps:
      - if: env.HAS_KEY != 'true'
        run: echo "GCP_SA_KEY not set - skipping real-device tests"
      - if: env.HAS_KEY == 'true'
        uses: actions/download-artifact@v4
        with: { name: zadx-android-apk }
      - if: env.HAS_KEY == 'true'
        uses: google-github-actions/auth@v2
        with: { credentials_json: "${{ secrets.GCP_SA_KEY }}" }
      - if: env.HAS_KEY == 'true'
        uses: google-github-actions/setup-gcloud@v2
      - if: env.HAS_KEY == 'true'
        name: Robo test on real phones
        run: |
          gcloud firebase test android run --type robo --app app-debug.apk \
            --device model=oriole,version=33 --device model=a10,version=29 \
            --timeout 5m --locales ar,en

  # 4) iOS compile check (no signing)
  ios:
    # macOS minutes are the most expensive: nightly/manual, or on main when iOS/app code changed.
    needs: changes
    if: >-
      always() &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && needs.changes.outputs.ios == 'true'))
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: |
          mkdir -p /tmp/keep && cp -r android ios /tmp/keep/
          flutter create --org com.zadx --project-name zadx --platforms android,ios .
          cp -r /tmp/keep/ios/. ios/
          rm -f test/widget_test.dart
          flutter pub get && flutter gen-l10n
          ruby ios/scripts/add_native_files.rb
          sed -i '' "s/^# platform :ios.*/platform :ios, '16.0'/" ios/Podfile || true
          # Simulator build: proves the iOS app compiles without an Apple signing team.
          flutter build ios --simulator --debug

  # 5) Backend (Firebase Functions) compiles
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: { run: { working-directory: backend/functions } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('backend/functions/package.json', 'backend/functions/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - run: npm install
      - run: npm run build
      - run: npm test
      - run: npm audit --audit-level=high

  # 6) Windows "Zad X Guard" builds
  #    Windows minutes cost extra: nightly/manual, or on main when windows_guard/ changed.
  windows-guard:
    needs: changes
    if: >-
      always() &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && needs.changes.outputs.windows == 'true'))
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x" }
      - run: dotnet build windows_guard/ZadXGuard.csproj -c Release
